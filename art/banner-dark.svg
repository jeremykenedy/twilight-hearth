<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200"><style>@keyframes flicker{0%,100%{transform:scale(1)}35%{transform:scale(.96,1.06)}70%{transform:scale(1.03,.95)}}.flame{animation:flicker 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.inner{animation-duration:3s;animation-delay:-1s}@media(prefers-reduced-motion:reduce){.flame{animation:none}}</style><defs><linearGradient id="bg"><stop stop-color="#0c0a09" /><stop offset="1" stop-color="#1c1917" /></linearGradient><linearGradient id="fire" x2="0" y2="1"><stop stop-color="#fbbf24" /><stop offset="1" stop-color="#ef4444" /></linearGradient></defs><rect width="800" height="200" rx="16" fill="url(#bg)" /><g font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><text x="36" y="80" font-size="40" font-weight="700" letter-spacing="-.5" fill="#fff">Twilight Hearth</text><text x="38" y="111" font-size="14" fill="#a8a29e">Real fire. Soft light. A room at rest.</text><rect x="38" y="132" width="140" height="22" rx="11" fill="#1a1a1a" stroke="#f59e0b" stroke-width=".8" /><text x="108" y="147" text-anchor="middle" font-size="10" font-weight="500" fill="#fbbf24">No tracking or analytics</text><rect x="188" y="132" width="110" height="22" rx="11" fill="#1a1a1a" stroke="#60a5fa" stroke-width=".8" /><text x="243" y="147" text-anchor="middle" font-size="10" font-weight="500" fill="#60a5fa">Offline playback</text></g><g transform="translate(574 35)"><rect x="-10" y="-4" width="196" height="12" rx="2" fill="#735143" /><rect width="176" height="132" rx="4" fill="#4b4441" /><rect x="16" y="15" width="144" height="105" rx="2" fill="#171310" /><path d="M28 125h120" stroke="#ae8870" stroke-width="8" /><path class="flame" d="M62 105Q28 78 73 40Q65 69 101 23Q136 84 114 105Z" fill="url(#fire)" /><path class="flame inner" d="M80 108Q64 88 93 64Q114 94 103 108Z" fill="#fef3c7" /><path d="M51 112h78" stroke="#442d21" stroke-width="9" stroke-linecap="round" /></g></svg>