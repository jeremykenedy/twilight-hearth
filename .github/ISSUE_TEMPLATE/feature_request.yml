name: Feature request
description: Suggest a focused screensaver or settings improvement.
title: "Feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What should improve?
      description: Describe the viewing or configuration need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the change and how it should work with a TV remote.
    validations:
      required: true
